<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Học Viên - Phần 2</title>
    <style>
        body {
            font-family: Arial, Tahoma, sans-serif;
            background-color: #eef2f7;
            padding: 30px 15px;
            color: #2c3e50;
        }
        .form-card {
            max-width: 620px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label.field-label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], input[type="email"], input[type="date"], select, textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
        }
        .inline-group label {
            display: inline-block;
            margin-right: 18px;
            font-weight: normal;
            font-size: 14px;
            cursor: pointer;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }
        input[type="submit"], input[type="reset"] {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }
        input[type="submit"] {
            background-color: #2563eb;
            color: #ffffff;
        }
        input[type="submit"]:hover {
            background-color: #1d4ed8;
        }
        input[type="reset"] {
            background-color: #94a3b8;
            color: #ffffff;
        }
        input[type="reset"]:hover {
            background-color: #64748b;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <!-- Họ và tên -->
            <div class="form-group">
                <label class="field-label" for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="field-label" for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label class="field-label" for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" placeholder="0987654321" required>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
                <label class="field-label" for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <!-- Giới tính: Radio button name="gender" -->
            <div class="form-group">
                <label class="field-label">Giới tính:</label>
                <div class="inline-group">
                    <label><input type="radio" name="gender" value="nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="nu"> Nữ</label>
                    <label><input type="radio" name="gender" value="khac"> Khác</label>
                </div>
            </div>

            <!-- Địa chỉ: Textarea name="address" -->
            <div class="form-group">
                <label class="field-label" for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="2" placeholder="Nhập địa chỉ nơi cư trú"></textarea>
            </div>

            <!-- Khóa học: Select box name="course" -->
            <div class="form-group">
                <label class="field-label" for="course">Khóa học:</label>
                <select id="course" name="course" required>
                    <option value="html-css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <!-- Hình thức học: Radio button name="study_type" -->
            <div class="form-group">
                <label class="field-label">Hình thức học:</label>
                <div class="inline-group">
                    <label><input type="radio" name="study_type" value="online" checked> Online</label>
                    <label><input type="radio" name="study_type" value="offline"> Offline</label>
                </div>
            </div>

            <!-- Sở thích: CheckBox name="hobby" -->
            <div class="form-group">
                <label class="field-label">Sở thích:</label>
                <div class="inline-group">
                    <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
                    <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="gaming"> Chơi game</label>
                    <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
                </div>
            </div>

            <!-- Ghi chú: Textarea name="note" -->
            <div class="form-group">
                <label class="field-label" for="note">Ghi chú:</label>
                <textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm (nếu có)"></textarea>
            </div>

            <!-- Nút Đăng ký (Submit) và Nhập lại (Reset) -->
            <div class="btn-actions">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>
</body>
</html>
